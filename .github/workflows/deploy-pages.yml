name: Deploy to GitHub Pages

# Publishes the Blazor WASM store to GitHub Pages on every push to main.
# Requires Pages to be enabled with "GitHub Actions" as the source (repo Settings → Pages).
# Note: GitHub Pages on a private repo needs a paid plan; otherwise make the repo public.

on:
  push:
    branches: [main]
    paths:
      - "src/AssetStore.App/**"
      - "src/AssetStore.UI/**"
      - "src/AssetStore.Core/**"
      - "Directory.Build.props"
      - ".github/workflows/deploy-pages.yml"
  schedule:
    # Daily, after AssetContainer's 06:00 index refresh: regenerates the per-asset
    # OG/SEO snapshot pages so new assets get shareable link previews within a day.
    - cron: "45 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish
        run: dotnet publish src/AssetStore.App/AssetStore.App.csproj -c Release -o publish

      - name: Rewrite base href for project pages
        run: sed -i 's|<base href="/" />|<base href="/AssetStore/" />|' publish/wwwroot/index.html

      - name: Generate per-asset OG pages + sitemap
        run: |
          curl -fsSL "https://raw.githubusercontent.com/Nicogo1705/AssetContainer/main/index.lock.json" -o index.lock.json
          dotnet run --project src/AssetStore.Cli/AssetStore.Cli.csproj -c Release -- \
            generate-pages --index index.lock.json --out publish/wwwroot \
            --app-index publish/wwwroot/index.html \
            --site "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"

      - name: SPA fallback + disable Jekyll
        run: |
          cp publish/wwwroot/index.html publish/wwwroot/404.html
          touch publish/wwwroot/.nojekyll

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: publish/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
